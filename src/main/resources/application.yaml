spring:
  application:
    name: nyangttang-server

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nyangttang}
    username: ${DB_USERNAME:nyangttang_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

server:
  port: 8080